<nav class="app-navbar">
  <mat-toolbar color="primary" class="app-toolbar">
    <button
      mat-icon-button
      class="app-toolbar__menu"
      aria-label="Toggle navigation menu"
      (click)="drawer.toggle()"
    >
      <mat-icon>menu</mat-icon>
    </button>

    <a class="app-brand" routerLink="/home" aria-label="Go to the home page">
      <span class="app-brand__badge">
        <mat-icon>auto_stories</mat-icon>
      </span>
      <span class="app-brand__title">{{ title }}</span>
    </a>

    <span class="example-spacer"></span>

    @if (authService.userData; as user) {
      <div class="app-user" [title]="user.email ?? ''">
        <span class="app-user__avatar" aria-hidden="true">
          @if (user.photoURL) {
            <img [src]="user.photoURL" alt="" />
          } @else {
            {{ userInitials }}
          }
        </span>
        <span class="app-user__name">{{ userName }}</span>
      </div>

      <button
        mat-icon-button
        class="app-toolbar__logout"
        aria-label="Sign out"
        matTooltip="Sign out"
        (click)="signOut()"
      >
        <mat-icon>logout</mat-icon>
      </button>

      <span class="app-toolbar__divider" aria-hidden="true"></span>
    }

    <ang23-mode-toggle />
  </mat-toolbar>
</nav>

<mat-drawer-container class="example-container" autosize>
  <mat-drawer #drawer class="example-sidenav" mode="side">
    <p class="example-sidenav__label">Workspace</p>
    <mat-nav-list #components>
      @for (component of componentList; track component.route) {
        <mat-list-item
          [routerLink]="component.route"
          routerLinkActive="active-link"
        >
          <mat-icon matListItemIcon>{{ component.icon }}</mat-icon>
          <span matListItemTitle>{{ component.name }}</span>

          @if (component.locked) {
            <mat-icon class="pt-2">lock</mat-icon>
          }
        </mat-list-item>
      }
    </mat-nav-list>
  </mat-drawer>

  <div class="example-sidenav-content">
    <router-outlet></router-outlet>
  </div>
</mat-drawer-container>
