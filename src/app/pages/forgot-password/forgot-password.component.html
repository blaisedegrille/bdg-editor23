<app-auth-card
  title="Reset your password"
  subtitle="Enter the email linked to your account and we'll send you a reset link."
  icon="lock_reset"
>
  <form
    class="auth-form"
    [formGroup]="resetForm"
    (ngSubmit)="onSubmit()"
    novalidate
  >
    @if (errorMessage(); as message) {
      <div class="auth-alert" role="alert">
        <mat-icon aria-hidden="true">error_outline</mat-icon>
        <span>{{ message }}</span>
      </div>
    }

    <mat-form-field appearance="outline" class="auth-field">
      <mat-label>Email</mat-label>
      <mat-icon matPrefix aria-hidden="true">mail_outline</mat-icon>
      <input
        matInput
        type="email"
        formControlName="email"
        autocomplete="email"
        inputmode="email"
        required
      />
      @if (email.hasError('required')) {
        <mat-error>Email is required.</mat-error>
      } @else if (email.hasError('email')) {
        <mat-error>Enter a valid email address.</mat-error>
      }
    </mat-form-field>

    <button
      mat-flat-button
      class="auth-form__submit"
      type="submit"
      [disabled]="submitting()"
    >
      @if (submitting()) {
        <mat-progress-spinner
          class="auth-form__spinner"
          diameter="18"
          mode="indeterminate"
          aria-label="Sending reset email"
        />
        <span>Sending…</span>
      } @else {
        <span>Send reset link</span>
      }
    </button>
  </form>

  <div authFooter class="auth-footer">
    <span>Remembered your password?</span>
    <a mat-button routerLink="/sign-in">Back to sign in</a>
  </div>
</app-auth-card>
