<app-auth-card
  [title]="'auth.reset.title' | t"
  [subtitle]="'auth.reset.subtitle' | t"
  icon="lock_reset"
>
  <form
    class="auth-form"
    [formGroup]="resetForm"
    (ngSubmit)="onSubmit()"
    novalidate
  >
    @if (errorMessage(); as message) {
      <div class="auth-alert" role="alert">
        <mat-icon aria-hidden="true">error_outline</mat-icon>
        <span>{{ message }}</span>
      </div>
    }

    <mat-form-field appearance="outline" class="auth-field">
      <mat-label>{{ 'auth.email' | t }}</mat-label>
      <mat-icon matPrefix aria-hidden="true">mail_outline</mat-icon>
      <input
        matInput
        type="email"
        formControlName="email"
        autocomplete="email"
        inputmode="email"
        required
      />
      @if (email.hasError('required')) {
        <mat-error>{{ 'auth.emailRequired' | t }}</mat-error>
      } @else if (email.hasError('email')) {
        <mat-error>{{ 'auth.emailInvalid' | t }}</mat-error>
      }
    </mat-form-field>

    <button
      mat-flat-button
      class="auth-form__submit"
      type="submit"
      [disabled]="submitting()"
    >
      @if (submitting()) {
        <mat-progress-spinner
          class="auth-form__spinner"
          diameter="18"
          mode="indeterminate"
          [attr.aria-label]="'auth.spinner.sendingReset' | t"
        />
        <span>{{ 'auth.reset.submitting' | t }}</span>
      } @else {
        <span>{{ 'auth.reset.submit' | t }}</span>
      }
    </button>
  </form>

  <div authFooter class="auth-footer">
    <span>{{ 'auth.reset.footer' | t }}</span>
    <a mat-button routerLink="/sign-in">{{ 'auth.reset.back' | t }}</a>
  </div>
</app-auth-card>
