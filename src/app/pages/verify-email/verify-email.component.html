<app-auth-card
  [title]="'auth.verify.title' | t"
  [subtitle]="'auth.verify.subtitle' | t"
  icon="mark_email_read"
>
  @if (authService.userData; as user) {
    <p class="verify-email__address">
      <mat-icon aria-hidden="true">mail_outline</mat-icon>
      <span>{{ user.email }}</span>
    </p>
  }

  <p class="verify-email__text">{{ 'auth.verify.body' | t }}</p>

  @if (errorMessage(); as message) {
    <div class="auth-alert" role="alert">
      <mat-icon aria-hidden="true">error_outline</mat-icon>
      <span>{{ message }}</span>
    </div>
  }

  <button
    mat-stroked-button
    class="verify-email__resend"
    type="button"
    [disabled]="resending()"
    (click)="resendVerificationEmail()"
  >
    <mat-icon aria-hidden="true">forward_to_inbox</mat-icon>
    @if (resending()) {
      <mat-progress-spinner
        class="verify-email__spinner"
        diameter="18"
        mode="indeterminate"
        [attr.aria-label]="'auth.spinner.resending' | t"
      />
      <span>{{ 'auth.verify.resending' | t }}</span>
    } @else {
      <span>{{ 'auth.verify.resend' | t }}</span>
    }
  </button>

  <div authFooter class="auth-footer">
    <span>{{ 'auth.verify.footer' | t }}</span>
    <a mat-button routerLink="/sign-in">{{ 'auth.verify.back' | t }}</a>
  </div>
</app-auth-card>
