<app-auth-card
  title="Check your inbox"
  subtitle="We've sent a verification link to confirm your email address."
  icon="mark_email_read"
>
  @if (authService.userData; as user) {
    <p class="verify-email__address">
      <mat-icon aria-hidden="true">mail_outline</mat-icon>
      <span>{{ user.email }}</span>
    </p>
  }

  <p class="verify-email__text">
    Click the link in the email to activate your account. If you don't see it,
    check your spam folder or resend it below.
  </p>

  @if (errorMessage(); as message) {
    <div class="auth-alert" role="alert">
      <mat-icon aria-hidden="true">error_outline</mat-icon>
      <span>{{ message }}</span>
    </div>
  }

  <button
    mat-stroked-button
    class="verify-email__resend"
    type="button"
    [disabled]="resending()"
    (click)="resendVerificationEmail()"
  >
    <mat-icon aria-hidden="true">forward_to_inbox</mat-icon>
    @if (resending()) {
      <mat-progress-spinner
        class="verify-email__spinner"
        diameter="18"
        mode="indeterminate"
        aria-label="Resending verification email"
      />
      <span>Sending…</span>
    } @else {
      <span>Resend verification email</span>
    }
  </button>

  <div authFooter class="auth-footer">
    <span>Already verified?</span>
    <a mat-button routerLink="/sign-in">Back to sign in</a>
  </div>
</app-auth-card>
